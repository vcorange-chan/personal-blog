<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Practice</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f7f4;
    --surface: #ffffff;
    --border: #e8e4de;
    --border-strong: #d0cbc3;
    --text: #1a1714;
    --text-muted: #6b6560;
    --text-faint: #a09990;
    --accent: #5b4fcf;
    --accent-bg: #eeedfe;
    --accent-text: #3c3489;
    --teal-bg: #e1f5ee;
    --teal-text: #085041;
    --amber-bg: #faeeda;
    --amber-text: #633806;
    --blue-bg: #e6f1fb;
    --blue-text: #0c447c;
    --green-bg: #eaf3de;
    --green-text: #27500a;
    --font: 'Georgia', 'Noto Serif SC', serif;
    --font-ui: system-ui, -apple-system, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    line-height: 1.6;
    padding: 2rem 1rem 4rem;
    min-height: 100vh;
  }

  .page-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .page-header h1 {
    font-family: var(--font);
    font-size: 1.75rem;
    font-weight: normal;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 0.4rem;
  }

  .page-header p {
    font-size: 0.875rem;
    color: var(--text-muted);
  }

  .section {
    max-width: 680px;
    margin: 0 auto 3rem;
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 1rem;
    padding-left: 2px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .tab {
    font-size: 0.75rem;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-ui);
  }

  .tab:hover { background: var(--bg); }

  .tab.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  /* ── PROGRESS ── */
  .prog-wrap {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 1.5rem;
  }

  .prog-fill {
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 1.5rem 1.25rem;
    margin-bottom: 1rem;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .card-num {
    font-size: 0.75rem;
    color: var(--text-faint);
    font-family: var(--font-ui);
  }

  .badge {
    font-size: 0.7rem;
    padding: 2px 10px;
    border-radius: 20px;
    font-family: var(--font-ui);
  }

  .badge-haircut  { background: var(--amber-bg);  color: var(--amber-text); }
  .badge-accent   { background: var(--accent-bg); color: var(--accent-text); }
  .badge-deepseek { background: var(--teal-bg);   color: var(--teal-text); }
  .badge-chatgpt  { background: var(--blue-bg);   color: var(--blue-text); }
  .badge-general  { background: var(--blue-bg);   color: var(--blue-text); }
  .badge-ai       { background: var(--teal-bg);   color: var(--teal-text); }

  /* ── FLASHCARD FLIP ── */
  .flip-scene {
    perspective: 1000px;
    width: 100%;
    margin-bottom: 1rem;
  }

  .flip-inner {
    position: relative;
    width: 100%;
    min-height: 160px;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
    cursor: pointer;
  }

  .flip-inner.flipped { transform: rotateY(180deg); }

  .flip-face {
    position: absolute;
    width: 100%;
    min-height: 160px;
    backface-visibility: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .flip-back { transform: rotateY(180deg); }

  .flip-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 0.75rem;
  }

  .flip-en {
    font-size: 1.125rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 0.4rem;
    line-height: 1.4;
  }

  .flip-zh {
    font-size: 0.875rem;
    color: var(--text-muted);
  }

  .flip-hint {
    font-size: 0.7rem;
    color: var(--text-faint);
    margin-top: 1rem;
  }

  .flip-example {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
    margin-top: 0.5rem;
    width: 100%;
    text-align: left;
  }

  /* ── ORAL PRACTICE ── */
  .q-zh {
    font-size: 1.0625rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 1.25rem;
  }

  .reveal-btn {
    font-size: 0.8125rem;
    padding: 7px 18px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-family: var(--font-ui);
    transition: all 0.15s;
  }

  .reveal-btn:hover { background: var(--bg); color: var(--text); }

  .answer-wrap {
    margin-top: 1rem;
    border-left: 2px solid var(--accent);
    padding-left: 1rem;
  }

  .answer-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }

  .answer-en {
    font-size: 0.9375rem;
    color: var(--text);
    line-height: 1.75;
    margin-bottom: 0.75rem;
    font-family: var(--font);
  }

  .answer-note {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.65;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border-radius: 6px;
  }

  .answer-note strong, .answer-note .kw {
    color: var(--accent-text);
    font-weight: 600;
  }

  /* ── NAV ── */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .nav-btn {
    font-size: 0.8125rem;
    padding: 7px 18px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-family: var(--font-ui);
    transition: all 0.15s;
  }

  .nav-btn:hover { background: var(--bg); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .nav-info {
    font-size: 0.8125rem;
    color: var(--text-faint);
  }

  .shuffle-btn {
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    font-family: var(--font-ui);
    transition: all 0.15s;
  }

  .shuffle-btn:hover { background: var(--bg); color: var(--text-muted); }

  .divider {
    max-width: 680px;
    margin: 0 auto 3rem;
    border: none;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 480px) {
    body { padding: 1.25rem 0.75rem 3rem; }
    .flip-en { font-size: 1rem; }
    .q-zh { font-size: 0.9375rem; }
  }
</style>
</head>
<body>

<header class="page-header">
  <h1>English Practice</h1>
  <p>单词短语 · 口语翻译练习</p>
</header>

<!-- ══════════════ SECTION 1: FLASHCARDS ══════════════ -->
<section class="section" id="fc-section">
  <div class="section-label">单词 &amp; 短语</div>

  <div class="tabs" id="fc-tabs">
    <button type="button" class="tab active" data-filter="all">全部</button>
    <button type="button" class="tab" data-filter="ai">AI &amp; tech</button>
    <button type="button" class="tab" data-filter="accent">口音</button>
    <button type="button" class="tab" data-filter="haircut">理发</button>
    <button type="button" class="tab" data-filter="general">通用表达</button>
  </div>

  <div class="prog-wrap"><div class="prog-fill" id="fc-prog"></div></div>

  <div class="card">
    <div class="card-meta">
      <span class="card-num" id="fc-num"></span>
      <div style="display:flex;align-items:center;gap:8px;">
        <button type="button" class="shuffle-btn" id="fc-shuffle">↺ 随机</button>
        <span class="badge" id="fc-badge"></span>
      </div>
    </div>
    <div class="flip-scene">
      <div class="flip-inner" id="fc-card">
        <div class="flip-face flip-front">
          <div class="flip-label">点击翻面看例句</div>
          <div class="flip-en" id="fc-front-en"></div>
          <div class="flip-zh" id="fc-front-zh"></div>
          <div class="flip-hint">tap to flip</div>
        </div>
        <div class="flip-face flip-back">
          <div class="flip-label">例句</div>
          <div class="flip-example" id="fc-back-ex"></div>
          <div class="flip-hint">tap to flip back</div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button type="button" class="nav-btn" id="fc-prev">← 上一个</button>
    <span class="nav-info" id="fc-counter"></span>
    <button type="button" class="nav-btn" id="fc-next">下一个 →</button>
  </div>
</section>

<hr class="divider">

<!-- ══════════════ SECTION 2: ORAL PRACTICE ══════════════ -->
<section class="section" id="op-section">
  <div class="section-label">口语翻译练习</div>

  <div class="tabs" id="op-tabs">
    <button type="button" class="tab active" data-filter="all">全部</button>
    <button type="button" class="tab" data-filter="haircut">理发</button>
    <button type="button" class="tab" data-filter="accent">口音</button>
    <button type="button" class="tab" data-filter="deepseek">DeepSeek</button>
    <button type="button" class="tab" data-filter="chatgpt">ChatGPT / Claude</button>
  </div>

  <div class="prog-wrap"><div class="prog-fill" id="op-prog"></div></div>

  <div class="card">
    <div class="card-meta">
      <span class="card-num" id="op-num"></span>
      <span class="badge" id="op-badge"></span>
    </div>
    <div class="q-zh" id="op-zh"></div>
    <button type="button" class="reveal-btn" id="op-reveal-btn">显示答案</button>
    <div id="op-answer" style="display:none;">
      <div class="answer-wrap">
        <div class="answer-label">参考答案</div>
        <div class="answer-en" id="op-en"></div>
        <div class="answer-note" id="op-note"></div>
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button type="button" class="nav-btn" id="op-prev">← 上一题</button>
    <span class="nav-info" id="op-counter"></span>
    <button type="button" class="nav-btn" id="op-next">下一题 →</button>
  </div>
</section>

<script>
/* ══════════ FLASHCARD DATA ══════════ */
const FC_ALL = [
  {cat:'ai', en:'stumble into it', zh:'偶然发现／无心插柳', ex:'"I stumbled into using Claude — saw a post on X and just gave it a try."'},
  {cat:'ai', en:'beta version', zh:'内测版本', ex:'"It\'s not public yet — it\'s still in beta, just for internal testing."'},
  {cat:'ai', en:'run out of tokens', zh:'用完了token额度', ex:'"Claude is great but I keep running out of tokens — it gets expensive."'},

  {cat:'ai', en:'repetitive tasks', zh:'重复性工作', ex:'"AI frees me up from repetitive tasks so I can focus on the logic."'},

  {cat:'ai', en:'come up', zh:'（事情）出现，冒出来', ex:'"I was browsing X and following some tech accounts, and ChatGPT just came up."'},
  {cat:'ai', en:'come across', zh:'偶然看到，碰到', ex:'"I came across a post where someone tested ChatGPT and Claude on the same novel."'},
  {cat:'ai', en:'give it a try', zh:'试一试', ex:'"So I gave Claude a try and found it much more natural to interact with."'},
  {cat:'ai', en:'collaborate with', zh:'与……协作配合', ex:'"It feels more like a real conversation — it\'s just easier to collaborate with."'},
  {cat:'ai', en:'the one downside', zh:'唯一的缺点', ex:'"The one downside with Claude is the tokens run out fast."'},
  {cat:'ai', en:'slip up on', zh:'在某方面出错（本来能做好，一时失手）', ex:'"Claude is great for reasoning, but it does slip up on code sometimes."'},

  {cat:'accent', en:'stress the wrong syllable', zh:'重音放错了', ex:'"I was stressing the wrong syllable in \'practice\' for years without realizing it."'},
  {cat:'accent', en:'it hit me', zh:'我突然意识到', ex:'"It hit me in university — my pronunciation sounded completely different from everyone else\'s."'},
  {cat:'accent', en:'pick up an accent', zh:'沾染口音', ex:'"By graduation, all my roommates had picked up my accent without even realizing it."'},
  {cat:'accent', en:'contagious', zh:'有传染性的', ex:'"My accent turned out to be really contagious — I infected the whole dorm."'},
  {cat:'accent', en:'exposed to', zh:'接触到，暴露于', ex:'"I was exposed to students from all over China and realized how different my accent was."'},
  {cat:'accent', en:'struggle with', zh:'在某方面吃力，应付不来', ex:'"Back then ChatGPT was pretty good at technical topics but struggled with anything cultural."'},
  {cat:'accent', en:'surrounded by', zh:'被……包围（环境、氛围均可用）', ex:'"I grew up completely surrounded by that accent — so I had no idea anything was off."'},
  {cat:'accent', en:'genuinely', zh:'真的、确实（强调发自内心，非假装）', ex:'"I genuinely had no idea my pronunciation was wrong for years."'},
  {cat:'accent', en:'something feels off', zh:'感觉哪里不对劲', ex:'"Something felt off about his pronunciation, but I couldn\'t pinpoint what."'},
  {cat:'accent', en:'turn out to be', zh:'结果是……，最终发现是……（带意外语气）', ex:'"My accent turned out to be really contagious — I didn\'t expect that at all."'},

  {cat:'haircut', en:'need a break', zh:'需要喘口气，换换心情', ex:'"I wasn\'t stressed for any particular reason — I just needed a break."'},
  {cat:'haircut', en:'fed up', zh:'烦透了，受够了', ex:'"I was just fed up with everything that week, so I went and got a haircut."'},

/* ══════════ ORAL PRACTICE DATA ══════════ */
const OP_ALL = [
  {cat:'haircut', zh:'每天早上起床，我头发都是乱的。',
   en:'Every morning when I wake up, my hair is a mess.',
   note:'让"头发"做主语：<strong>my hair is a mess</strong>，不说 "I have messy hair"。这是英语"让事物做主语"的典型习惯。'},

/* ══════════ FLASHCARD LOGIC ══════════ */
const catMeta = {
  ai:       {label:'AI & tech',         cls:'badge-ai'},
  accent:   {label:'口音',              cls:'badge-accent'},
  haircut:  {label:'理发',              cls:'badge-haircut'},
  general:  {label:'通用表达',          cls:'badge-general'},
  deepseek: {label:'DeepSeek',          cls:'badge-deepseek'},
  chatgpt:  {label:'ChatGPT / Claude',  cls:'badge-chatgpt'},
};

let fcList = [...FC_ALL];
let fcIdx = 0;
let fcFlipped = false;

function fcRender() {
  const c = fcList[fcIdx];
  document.getElementById('fc-num').textContent = `${fcIdx+1} / ${fcList.length}`;
  document.getElementById('fc-badge').textContent = catMeta[c.cat].label;
  document.getElementById('fc-badge').className = `badge ${catMeta[c.cat].cls}`;
  document.getElementById('fc-front-en').textContent = c.en;
  document.getElementById('fc-front-zh').textContent = c.zh;
  document.getElementById('fc-back-ex').textContent = c.ex;
  document.getElementById('fc-counter').textContent = `${fcIdx+1} / ${fcList.length}`;
  document.getElementById('fc-prog').style.width = `${((fcIdx+1)/fcList.length)*100}%`;
  document.getElementById('fc-prev').disabled = fcIdx === 0;
  document.getElementById('fc-next').disabled = fcIdx === fcList.length - 1;
  document.getElementById('fc-card').classList.remove('flipped');
  fcFlipped = false;
}

function fcFlip() {
  fcFlipped = !fcFlipped;
  document.getElementById('fc-card').classList.toggle('flipped', fcFlipped);
}

function fcGo(d) {
  const n = fcIdx + d;
  if (n >= 0 && n < fcList.length) { fcIdx = n; fcRender(); }
}

function fcShuffle() {
  for (let i = fcList.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [fcList[i],fcList[j]] = [fcList[j],fcList[i]];
  }
  fcIdx = 0; fcRender();
}

function fcFilter(cat, el) {
  document.querySelectorAll('#fc-tabs .tab').forEach((t) => {
    t.classList.remove('active');
  });
  el.classList.add('active');
  fcList = cat === 'all' ? [...FC_ALL] : FC_ALL.filter(c => c.cat === cat);
  fcIdx = 0; fcRender();
}

/* ══════════ ORAL PRACTICE LOGIC ══════════ */
let opList = [...OP_ALL];
let opIdx = 0;

function opRender() {
  const q = opList[opIdx];
  document.getElementById('op-num').textContent = `${opIdx+1} / ${opList.length}`;
  document.getElementById('op-badge').textContent = catMeta[q.cat].label;
  document.getElementById('op-badge').className = `badge ${catMeta[q.cat].cls}`;
  document.getElementById('op-zh').textContent = q.zh;
  document.getElementById('op-en').textContent = q.en;
  document.getElementById('op-note').innerHTML = q.note;
  document.getElementById('op-answer').style.display = 'none';
  document.getElementById('op-reveal-btn').style.display = 'inline-block';
  document.getElementById('op-counter').textContent = `${opIdx+1} / ${opList.length}`;
  document.getElementById('op-prog').style.width = `${((opIdx+1)/opList.length)*100}%`;
  document.getElementById('op-prev').disabled = opIdx === 0;
  document.getElementById('op-next').disabled = opIdx === opList.length - 1;
}

function opReveal() {
  document.getElementById('op-answer').style.display = 'block';
  document.getElementById('op-reveal-btn').style.display = 'none';
}

function opGo(d) {
  const n = opIdx + d;
  if (n >= 0 && n < opList.length) { opIdx = n; opRender(); }
}

function opFilter(cat, el) {
  document.querySelectorAll('#op-tabs .tab').forEach((t) => {
    t.classList.remove('active');
  });
  el.classList.add('active');
  opList = cat === 'all' ? [...OP_ALL] : OP_ALL.filter(q => q.cat === cat);
  opIdx = 0; opRender();
}

document.getElementById('fc-card').addEventListener('click', fcFlip);
document.getElementById('fc-shuffle').addEventListener('click', fcShuffle);
document.getElementById('fc-prev').addEventListener('click', () => fcGo(-1));
document.getElementById('fc-next').addEventListener('click', () => fcGo(1));
document.querySelectorAll('#fc-tabs .tab').forEach((tab) => {
  tab.addEventListener('click', () => fcFilter(tab.dataset.filter, tab));
});

document.getElementById('op-reveal-btn').addEventListener('click', opReveal);
document.getElementById('op-prev').addEventListener('click', () => opGo(-1));
document.getElementById('op-next').addEventListener('click', () => opGo(1));
document.querySelectorAll('#op-tabs .tab').forEach((tab) => {
  tab.addEventListener('click', () => opFilter(tab.dataset.filter, tab));
});

fcRender();
opRender();
</script>
</body>
